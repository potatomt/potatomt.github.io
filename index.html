<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Discord Member Count</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  /* ============ SETTINGS ============ */
  :root {
    --bg: #12061f;                    /* deep violet night */
    --card: rgba(24, 10, 38, .32);    /* glassy cards so birds show through */
    --line: rgba(255, 120, 220, .18);
    --text: #fbeefe;
    --muted: #c3a6d6;
    --pink: #ff4fd8;
    --violet: #8b5cf6;
    --green: #3ddc97;
    --digit-h: 1em;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  #bg { position: fixed; inset: 0; z-index: -1; background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { width: min(980px, 100%); text-align: center; position: relative; }
  .counter-card, .stat, .graph { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  /* Server header */
  .server { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 28px; min-height: 72px; }
  .server img { width: 72px; height: 72px; border-radius: 22px; background: var(--card); object-fit: cover; box-shadow: 0 0 0 2px rgba(255,79,216,.5), 0 0 30px rgba(139,92,246,.6); }
  .server h1 { font-size: clamp(22px, 4vw, 34px); font-weight: 800; text-align: left; }
  .server .sub { color: var(--muted); font-size: 14px; text-align: left; margin-top: 2px; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--pink); font-weight: 600; font-size: 13px; letter-spacing: .08em; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 10px var(--pink); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  /* Big counter */
  .counter-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 28px;
    padding: clamp(24px, 5vw, 48px) 16px 28px; position: relative; overflow: hidden;
  }
  .label { color: var(--muted); font-weight: 600; letter-spacing: .2em; font-size: 13px; text-transform: uppercase; margin-bottom: 14px; }
  .odometer {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: clamp(56px, 14vw, 150px);
    line-height: var(--digit-h);
    display: inline-flex; justify-content: center;
    font-variant-numeric: tabular-nums;
    filter: drop-shadow(0 0 14px rgba(255,79,216,.6)) drop-shadow(0 0 40px rgba(139,92,246,.5));
  }
  .digit { height: var(--digit-h); overflow: hidden; display: inline-block; width: .62em; position: relative; }
  .strip { display: flex; flex-direction: column; transition: transform 1.2s cubic-bezier(.2,.9,.25,1); }
  .strip span { height: var(--digit-h); display: block; }
  .sep { width: .35em; display: inline-block; color: var(--muted); }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { color: var(--pink); } 100% { color: var(--text); } }

  .delta { position: absolute; right: 24px; top: 20px; font-weight: 800; color: var(--pink); font-size: 22px; opacity: 0; text-shadow: 0 0 14px var(--pink); }
  .delta.show { animation: floatUp 2s ease-out; }
  .delta.neg { color: #f23f43; }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(10px) } 15% { opacity: 1 } 100% { opacity: 0; transform: translateY(-30px) } }

  /* Progress bar to next update */
  .bar { height: 3px; background: var(--line); border-radius: 3px; margin: 26px auto 0; width: min(420px, 80%); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--pink)); box-shadow: 0 0 10px var(--pink); }

  /* Stats row */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
  .stat b { display: block; font-size: 26px; font-weight: 800; font-family: "JetBrains Mono", monospace; }
  .stat small { color: var(--muted); font-size: 13px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: middle; }

  /* Graph */
  .graph { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 14px; }
  .graph svg { width: 100%; height: 90px; display: block; }
  .graph .empty { color: var(--muted); font-size: 13px; padding: 30px 0; }

  .foot { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .foot a { color: var(--muted); }


  @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } .delta { font-size: 16px; } }
</style>
</head>
<body>
<div id="bg"></div>
<div class="wrap" id="app"></div>

<!-- Birds background (Vanta.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.birds.min.js"></script>
<script>
  try {
    VANTA.BIRDS({
      el: "#bg",
      mouseControls: true, touchControls: true, gyroControls: false,
      minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1,
      backgroundColor: 0x12061f,  // deep violet
      color1: 0xff4fd8,           // pink
      color2: 0x8b5cf6,           // violet
      colorMode: "lerpGradient",
      birdSize: 1.5, wingSpan: 28, speedLimit: 4,
      separation: 40, alignment: 30, cohesion: 25, quantity: 4
    });
  } catch (e) { console.warn("Birds background didn't load", e); }
</script>

<script>
/* =====================================================
   Server invite (discord.gg/afterhr) — locked, URL can't change it
   ===================================================== */
const INVITE_CODE = "afterhr";
const REFRESH_SECONDS = 15;   // how often to check (don't go below ~10)
/* ===================================================== */

const app = document.getElementById("app");
const code = INVITE_CODE;

/* ---------- Counter ---------- */
function startCounter(code) {
  app.innerHTML = `
    <div class="server">
      <img id="icon" alt="">
      <div><h1 id="name">Loading…</h1><div class="sub"><span class="live">LIVE</span></div></div>
    </div>
    <div class="counter-card">
      <div class="label">Members</div>
      <div class="odometer" id="odo"></div>
      <div class="delta" id="delta"></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="stats">
      <div class="stat"><b id="online">–</b><small><span class="dot"></span>Online now</small></div>
      <div class="stat"><b id="gain">+0</b><small>Since you opened this page</small></div>
      <div class="stat"><b id="updated">–</b><small>Last update</small></div>
    </div>
    <div class="graph" id="graph"><div class="empty">The graph fills in as the count changes…</div></div>
    <div class="foot">Discord updates these numbers with a small delay · <a href="https://discord.gg/${code}" target="_blank" rel="noopener">Join the server</a></div>`;

  const odo = new Odometer(document.getElementById("odo"));
  let first = null, last = null, delay = REFRESH_SECONDS;
  const history = [];

  async function tick() {
    try {
      const res = await fetch(`https://discord.com/api/v10/invites/${encodeURIComponent(code)}?with_counts=true`);
      if (res.status === 404) { document.getElementById("name").textContent = "Invite not found"; return schedule(); }
      if (res.status === 429) { // rate limited → slow down
        const j = await res.json().catch(() => ({}));
        delay = Math.max(REFRESH_SECONDS, Math.ceil(j.retry_after || 30));
        return schedule();
      }
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      delay = REFRESH_SECONDS;

      const total = d.approximate_member_count;
      const online = d.approximate_presence_count;
      const g = d.guild || {};

      if (first === null) {
        first = total;
        document.getElementById("name").textContent = g.name || "Discord Server";
        document.title = `${g.name || "Discord"} – Live Member Count`;
        const icon = document.getElementById("icon");
        if (g.icon) icon.src = `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.${g.icon.startsWith("a_") ? "gif" : "png"}?size=256`;
        else icon.style.display = "none";
        odo.set(0, false);           // start at zero…
        setTimeout(() => odo.set(total, false), 60); // …then roll up
      } else if (total !== last) {
        odo.set(total, true);
        popDelta(total - last);
      }
      last = total;

      document.getElementById("online").textContent = online.toLocaleString("en-US");
      const gain = total - first;
      document.getElementById("gain").textContent = (gain >= 0 ? "+" : "") + gain.toLocaleString("en-US");
      document.getElementById("updated").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

      history.push({ t: Date.now(), v: total });
      if (history.length > 240) history.shift(); // ~1 hour at 15s
      drawGraph(history);
    } catch (err) {
      console.error(err);
      document.getElementById("updated").textContent = "retrying…";
    }
    schedule();
  }

  function schedule() {
    const bar = document.getElementById("bar");
    bar.style.transition = "none"; bar.style.width = "0";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      bar.style.transition = `width ${delay}s linear`; bar.style.width = "100%";
    }));
    setTimeout(tick, delay * 1000);
  }

  tick();
}

function popDelta(n) {
  const el = document.getElementById("delta");
  el.textContent = (n > 0 ? "+" : "") + n;
  el.className = "delta" + (n < 0 ? " neg" : "");
  void el.offsetWidth;
  el.classList.add("show");
}

function drawGraph(h) {
  const box = document.getElementById("graph");
  const vals = h.map(p => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  if (h.length < 2 || min === max) {
    if (h.length >= 2) box.innerHTML = `<div class="empty">No change yet. Holding at ${max.toLocaleString("en-US")}</div>`;
    return;
  }
  const W = 1000, H = 90, pad = 6;
  const pts = h.map((p, i) => {
    const x = (i / (h.length - 1)) * W;
    const y = H - pad - ((p.v - min) / (max - min)) * (H - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  box.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff4fd8" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
      </linearGradient><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient></defs>
      <polygon points="0,${H} ${pts.join(" ")} ${W},${H}" fill="url(#gr)"/>
      <polyline points="${pts.join(" ")}" fill="none" stroke="url(#ln)" stroke-width="3" vector-effect="non-scaling-stroke"/>
    </svg>`;
}

/* ---------- Rolling digits ---------- */
class Odometer {
  constructor(el) { this.el = el; this.str = ""; }
  set(n, flash) {
    const s = n.toLocaleString("en-US");
    if (s.length !== this.str.length) this.build(s);
    [...s].forEach((ch, i) => {
      const node = this.el.children[i];
      if (/\d/.test(ch)) {
        node.firstChild.style.transform = `translateY(-${Number(ch)}em)`;
        if (flash && ch !== this.str[i]) {
          node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash");
        }
      }
    });
    this.str = s;
  }
  build(s) {
    const old = this.str.padStart(s.length, " ");
    this.el.innerHTML = "";
    [...s].forEach((ch, i) => {
      if (/\d/.test(ch)) {
        const d = document.createElement("span"); d.className = "digit";
        const strip = document.createElement("span"); strip.className = "strip";
        for (let k = 0; k <= 9; k++) { const sp = document.createElement("span"); sp.textContent = k; strip.appendChild(sp); }
        const start = /\d/.test(old[i]) ? Number(old[i]) : 0;
        strip.style.transition = "none";
        strip.style.transform = `translateY(-${start}em)`;
        d.appendChild(strip); this.el.appendChild(d);
        void strip.offsetWidth; strip.style.transition = "";
      } else {
        const sp = document.createElement("span"); sp.className = "sep"; sp.textContent = ch;
        this.el.appendChild(sp);
      }
    });
  }
}

/* ---------- Go ---------- */
startCounter(code);
</script>
</body>
</html>
